name: 'C++ CI'

on:
  push:
    branches:
      - lab1

jobs:
  build_linux:
    runs-on: ubuntu-latest
    outputs:
      linux_asset: ${{ steps.package.outputs.asset_path }}
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      - run: cmake --build .
      - run: cmake --build . --target test
      - run: cmake --build . --target package

      - name: Set Linux asset path
        id: package
        run: echo "asset_path=$(find build/_CPack_Packages/Linux/DEB -name '*.deb')" >> $GITHUB_OUTPUT

  build_windows:
    runs-on: windows-latest
    permissions: write-all
    outputs:
      windows_asset: ${{ steps.package.outputs.asset_path }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            base-devel
            mingw-w64-x86_64-make
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-toolchain
            zip

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          cmake -G "MinGW Makefiles" .. -DPATCH_VERSION=${{ github.run_number }}
          cmake --build .
          cmake --build . --target test
          cmake --build . --target package
        env:
          MSYSTEM: MINGW64

      - name: Zip Windows build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          cd build
          zip -r ../helloworld-0.0.${{ github.run_number }}-Windows.zip *

      - name: Set Windows asset path
        id: package
        run: echo "asset_path=./helloworld-0.0.${{ github.run_number }}-Windows.zip" >> $GITHUB_OUTPUT

  release:
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows]
    permissions: write-all
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release 0.0.${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Linux asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ needs.build_linux.outputs.linux_asset }}
          asset_name: helloworld-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

      - name: Upload Windows asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ needs.build_windows.outputs.windows_asset }}
          asset_name: helloworld-0.0.${{ github.run_number }}-Windows.zip
          asset_content_type: application/zip